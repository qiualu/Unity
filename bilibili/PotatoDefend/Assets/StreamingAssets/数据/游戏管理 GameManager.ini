    void 更新面板();  // UpdatePanel()
 




界面外观 界面外观实例;  // UIFacade mUIFacade;
界面外观 (构造函数)	UIFacade	接收界面管理器实例，初始化各管理器
初始化遮罩	InitMask	初始化遮罩 UI 及画布引用
切换场景状态	ChangeSceneState	切换当前场景状态（接收基础场景状态实例）
显示遮罩	ShowMask	显示遮罩并播放渐入动画
离开场景完成	ExitSceneComplete	遮罩显示完毕后执行，切换场景状态
隐藏遮罩	HideMask	隐藏遮罩并播放渐出动画
初始化字典	InitDict	初始化当前场景面板字典，绑定面板脚本
清空字典	ClearDict	清空当前场景面板字典
向字典添加面板	AddPanelToDict	向界面管理器字典添加 UI 面板
创建 UI 并设置位置	CreateUIAndSetUIPosition	实例化 UI 并设置父物体、位置和缩放
获取精灵	GetSprite	获取精灵资源（调用游戏管理器）
获取音频片段	GetAudioClip	获取音频片段资源（调用游戏管理器）
获取运行时动画控制器	GetRuntimeAnimatorController	获取运行时动画控制器资源
获取游戏对象资源	GetGameObjectResource	从工厂获取游戏对象资源
将游戏物体放回对象池	PushGameObjectToFactory	将游戏对象放回对象池
切换背景音乐开关	CloseOrOpenBGMusic	切换背景音乐的开关状态
切换特效音开关	CloseOrOpenEffectMusic	切换特效音的开关状态
播放按钮音效	PlayButtonAudioClip	播放按钮点击音效
播放翻书音效	PlayPagingAudioClip	播放翻页音效




游戏管理 : 界面管理器 界面管理;  Awake(): new 界面管理器() : 界面管理.界面外观实例.当前场景状态.进入场景();
界面管理器:  new 界面外观(this); :  界面外观实例.当前场景状态 = new 开始加载场景状态(界面外观实例);
界面外观: 初始化遮罩();GameObject 遮罩; 
开始加载场景状态 : 界面外观实例.向字典添加面板(字符串管理.开始加载面板);
开始加载界面:    加载下一场景  : 界面外观实例.切换场景状态(new 主场景状态(界面外观实例)
 
进入场景()
